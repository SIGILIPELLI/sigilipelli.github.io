<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — Mastery Path</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --brand: #3f51b5;
    --brand-dark: #303f9f;
    --bg: #f5f6fa;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --error: #d32f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151f;
      --card-bg: #1e2030;
      --text: #eef0fa;
      --text-muted: #9aa0b4;
      --border: #2e3148;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 1.5rem;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    padding: 2.5rem;
    width: 100%;
    max-width: 400px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 1.75rem;
  }
  .brand-mark {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--brand), var(--brand-dark));
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 1rem;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.4rem; }
  .subtitle { color: var(--text-muted); font-size: 0.9rem; margin: 0 0 1.75rem; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem; }
  input {
    width: 100%;
    padding: 0.7rem 0.85rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.95rem;
    margin-bottom: 1.1rem;
    background: transparent;
    color: var(--text);
  }
  input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  button {
    width: 100%;
    padding: 0.75rem;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .btn-primary {
    background: var(--brand);
    color: white;
    margin-bottom: 0.85rem;
  }
  .btn-primary:hover { opacity: 0.92; }
  .btn-google {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  .divider {
    display: flex; align-items: center; gap: 0.75rem;
    color: var(--text-muted); font-size: 0.8rem;
    margin: 1.1rem 0;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--border);
  }
  .foot { margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted); text-align: center; }
  .foot a { color: var(--brand); text-decoration: none; font-weight: 600; }
  .error { color: var(--error); font-size: 0.85rem; margin: -0.5rem 0 1rem; min-height: 1.1em; }
  .reset-link { display: block; text-align: right; font-size: 0.8rem; margin: -0.7rem 0 1.1rem; color: var(--brand); text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="brand-mark">M</span>
      Mastery Path
    </div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to continue Levels 2-4 of your course.</p>

    <div id="error" class="error"></div>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">
    <a class="reset-link" id="reset-link" href="#">Forgot password?</a>

    <button class="btn-primary" id="signin-btn">Sign In</button>

    <div class="divider">or</div>

    <button class="btn-google" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.85.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <p class="foot">Don't have an account? <a href="/register.html">Create one</a></p>
  </div>

  <script type="module">
    import "/mastery-auth.js";

    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect") || "https://sigilipelli.github.io/";
    const errorEl = document.getElementById("error");

    function showError(err) {
      const map = {
        "auth/invalid-credential": "Incorrect email or password.",
        "auth/user-not-found": "No account found with that email.",
        "auth/wrong-password": "Incorrect email or password.",
        "auth/too-many-requests": "Too many attempts. Try again shortly.",
        "auth/invalid-email": "Enter a valid email address.",
      };
      errorEl.textContent = map[err.code] || "Something went wrong. Please try again.";
    }

    window.addEventListener("mastery-auth-ready", (e) => {
      if (e.detail.user) window.location.replace(redirect);
    }, { once: true });

    document.getElementById("signin-btn").addEventListener("click", async () => {
      errorEl.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      try {
        await window.masteryAuth.login(email, password);
        window.location.replace(redirect);
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById("google-btn").addEventListener("click", async () => {
      errorEl.textContent = "";
      try {
        await window.masteryAuth.loginWithGoogle();
        window.location.replace(redirect);
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById("reset-link").addEventListener("click", async (ev) => {
      ev.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        errorEl.textContent = "Enter your email above first, then click again.";
        return;
      }
      try {
        await window.masteryAuth.resetPassword(email);
        errorEl.style.color = "#2e7d32";
        errorEl.textContent = "Password reset email sent.";
      } catch (err) {
        showError(err);
      }
    });

    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("signin-btn").click();
    });
  </script>
</body>
</html>
