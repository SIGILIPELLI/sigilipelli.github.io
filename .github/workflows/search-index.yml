name: Rebuild search index

# Keeps site search in sync with the course sites: re-reads every course's published
# search data, rebuilds search/*.json and search-index.json, tests them, and commits changes.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/build_search_index.py"
      - "tools/search-config.json"
      - "assets/search.js"

permissions:
  contents: write

concurrency:
  group: search-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build index from the live course sites
        run: python tools/build_search_index.py .
      - name: Test search against every course and lesson
        run: node tools/test_search.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- search search-index.json; then
            echo "Search index already up to date."
            exit 0
          fi
          git config user.name "mastery-path-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add search search-index.json
          git commit -m "Update search index ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
